[package]
name = "packages"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Registers data-only content packages (chiacraft plan, phase 2) through the mod SDK"

[lib]
crate-type = ["cdylib"]

[dependencies]
weft_sdk.workspace = true
# What our own mods may ask the engine beyond Weft's mod interface.
chiacraft-bridge = { path = "../../crates/bridge" }
chiacraft-packages = { path = "../../crates/packages" }
chiacraft-sandbox = { path = "../../crates/sandbox" }
