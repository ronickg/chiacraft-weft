# Farmland read brick-red on Plants' crop sheet (11-04): hue 14 deg against vanilla's 26 and Pixel Perfection's 21,
# and darker than both. Turned toward their orange-brown and lifted a little; the wet one keeps its darkness;
# the worn stages (already less red) turned less, keeping their paler-per-level ladder.
[tiles.farmland]
hue = 9.0
gain = 1.2

[tiles.farmland_wet]
hue = 9.0

[tiles.farmland_worn_1]
hue = 7.0
gain = 1.19

[tiles.farmland_worn_2]
hue = 4.0
gain = 1.17

[tiles.farmland_worn_3]
hue = 1.0
gain = 1.12

# Ores in the rock faces (Terrain, 11-04; Ronald: "All 3: 1, 2, 3"): the host rock's own graded tile and
# variants with an ore overlay (mods/base/source/blocks/overlays/) laid on, so the rock reads as the
# wall's and follows its tuning. `shifts`: where the marks sit per variant; a seam keeps dy 0 so it
# stays level and runs on into the next block.
[tiles.banded_clay_coal_ore]
base = "banded_clay_side"
overlay = "ore_coal_seam"
shifts = [[0, 0], [9, 0], [17, 0], [25, 0]]

[tiles.red_sandstone_iron_ore]
base = "red_sandstone_side"
overlay = "ore_ironstone"

[tiles.granite_gold_ore]
base = "granite"
overlay = "ore_gold_quartz"

[tiles.granite_iron_ore]
base = "granite"
overlay = "ore_magnetite"

