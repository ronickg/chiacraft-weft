# The lexicon: every invented word in chiacraft, and the rules that make them.
#
# One source of truth. No invented word goes into the game, the lang files or the notes without an
# entry here, built from roots by the rules below. `tools/names/names.py` reads this file:
#
#   python3 tools/names/names.py gen --people elvish -n 40    candidates; a person picks
#   python3 tools/names/names.py derive eskenai --steps       every drift, every rule that fired
#   python3 tools/names/names.py check                        fails on any break (runs on CI)
#   python3 tools/names/names.py sheet > notes/NAMES.md       the generated sheet
#
# Why it is built this way, with sources: reports/Naming and invented words.md (sections 6-15).
# The roots and names are Ronald's first draft (11-06: "Yes, use Eskenai").
#
# The family tree:
#   Old Eskenai (dead, carved on altars, relics, gates) -> three drifts, applied in order:
#     soft  -> Elvish, and forest ruins
#     frost -> the dwarves' loans, and mountain and cold ruins
#     worn  -> humans and traders, coasts, plains, swamps, deserts; the latest era
#   Dwarvish is a tongue of its own, unrelated, with loans from Old Eskenai through the frost drift.

# What a name can be, in the order the sheet lists them.
kinds = ["people", "realm", "place", "dimension", "ruin", "boss", "person", "title", "relic", "rune", "spell", "weapon", "material", "word"]

# Sounds written with two letters that the tool reads as one sound, per tongue. A drift's rules can
# write any of them (`ch`, `sh`, `ng`, `ei`); `sk`, `st` and `sp` are always two sounds.
[sounds]
old = ["ai", "au"]
elvish = ["ai", "au", "ei"]
dwarvish_loan = ["ai", "au", "ch"]
worn = ["ai", "au", "sh", "ng"]
dwarvish = ["kv", "ch"]
rules = ["ai", "au", "ei", "ch", "sh", "ng", "kv"]

# SCA² categories, one capital letter each, used in the drift rules.
[categories]
V = ["a", "e", "i", "o", "u", "ai", "au", "ei"] # any vowel, diphthongs included
P = ["a", "e", "i", "o", "u"]                   # plain vowels
C = ["p", "t", "k", "b", "d", "g", "m", "n", "s", "h", "f", "r", "w", "y", "l", "v", "ch", "sh", "ng", "kv"]
F = ["e", "i", "ei"]                            # front vowels
G = ["k", "g"]

# ---------------------------------------------------------------------------------------------
# Peoples: each one's sounds, syllables and stress. `gen` draws from the weights; `check` holds
# every shown form to its people's rules.
#   from   = the tongue whose roots it uses ("old" for the drifts)
#   drift  = the drift that turns an Old word into this people's form
#   joins  = how roots join: "eskenai" (section 7) or "dwarvish" (just stacked, doubles merged)
#   stress = "first" syllable, or "last" root
#   onsets = clusters besides one consonant; initial_onsets only at a word's start
#   codas  = what may close a syllable inside a word; final_codas at the word's end
#   final_vowel = a word may end in a vowel
# ---------------------------------------------------------------------------------------------

[people.old]
title = "Old Eskenai"
about = "The ancients' tongue, carved on altars, relics, runes and gates. Dead, so it never changes."
from = "old"
joins = "eskenai"
stress = "first"
# Weights from section 7: k t s r n common, m d b g middling, h p f w y rare.
vowels = { a = 26, e = 20, i = 18, o = 14, u = 12, ai = 5, au = 5 }
consonants = { k = 10, t = 10, s = 10, r = 10, n = 10, m = 5, d = 5, b = 5, g = 5, h = 2, p = 2, f = 2, w = 2, y = 2 }
onsets = ["pr", "tr", "kr", "br", "dr", "gr"]
initial_onsets = ["sk", "st"]
# p closes a syllable only inside a word (kep + esk = Kepesk); a word never ends in it.
codas = ["m", "n", "r", "s", "t", "k", "p"]
final_codas = ["m", "n", "r", "s", "t", "k", "sk", "st"]
final_vowel = true
# How roots are drawn by `gen`: syllables per root (the 35 roots: 30 of one, 5 of two), and the
# chance (in %) that a syllable has an onset, that the onset is a cluster, and that it has a coda.
gen = { syllables = { 1 = 85, 2 = 15 }, onset = 85, cluster = 12, coda = 55, final_cluster = 6 }

[people.elvish]
title = "Elvish"
about = "Old Eskenai worn smooth by thousands of years of song: open, flowing, often ending in a vowel or -n, with b d g and l between vowels and ei common. The ancients' pupils, so their words are the easiest to trace back."
from = "old"
drift = "soft"
joins = "eskenai"
stress = "first"
vowels = ["a", "e", "i", "o", "u", "ai", "au", "ei"]
consonants = ["p", "t", "k", "b", "d", "g", "m", "n", "s", "h", "f", "r", "w", "y", "l"]
onsets = ["pr", "tr", "kr", "br", "dr", "gr"]
initial_onsets = []
codas = ["m", "n", "r", "s", "t", "k", "p", "l"]
final_codas = ["n"]
final_vowel = true

# The elves' homes (Ronald, 11-06: "well we can add more ones for them"). Each home names its
# realm and its dialect. A dialect is a drift: "soft", or one that extends it with rules of its
# own, written like this and named in a home's `drift`:
#   [drift.soft_<home>]
#   title = "..."
#   extends = "soft"
#   rules = [ { sca = "...", says = "..." } ]
# A name from that home gives `home = "<key>"` and is derived through the home's drift.
[people.elvish.homes.aludren]
realm = "aludren"
where = "Old-growth or birch forest with ley nodes, where the ley lines run strongest (the report's pick; could move to the giant groves once they exist)."
drift = "soft"

[people.dwarvish_loan]
title = "Dwarvish loans and mountain names (frost)"
about = "The ancients' words as the dwarves borrowed them from the mountain halls, and the names of mountain and cold ruins."
from = "old"
drift = "frost"
joins = "eskenai"
stress = "first"
vowels = ["a", "e", "i", "o", "u", "ai", "au"]
consonants = ["p", "t", "k", "b", "d", "g", "m", "n", "s", "h", "f", "r", "w", "y", "ch"]
onsets = ["pr", "tr", "kr", "br", "dr", "gr"]
initial_onsets = ["sk", "st"]
codas = ["m", "n", "r", "s", "t", "k", "p"]
final_codas = ["m", "n", "r", "s", "t", "k", "p", "sk", "st"]
final_vowel = true

[people.worn]
title = "Worn speech (humans, traders)"
about = "Plain English with the old words worn down: every trader calls a ruin a dokan. Also the coasts', plains', swamps' and deserts' ruins, until a desert or sea people of their own is added."
from = "old"
drift = "worn"
joins = "eskenai"
stress = "first"
vowels = ["a", "e", "i", "o", "u", "ai", "au"]
consonants = ["p", "t", "k", "b", "d", "g", "m", "n", "s", "h", "f", "r", "w", "y", "sh", "ng"]
onsets = ["pr", "tr", "kr", "br", "dr", "gr"]
initial_onsets = ["sk", "st"]
codas = ["m", "n", "r", "s", "t", "k", "p", "ng"]
final_codas = ["m", "n", "r", "s", "t", "k", "st", "sh"]
final_vowel = true

[people.dwarvish]
title = "Dwarvish"
about = "Their own tongue, not descended from the ancients'. Short, closed, stressed at the end, with lots of b d g r and kv: the sound of hammering, and of words said in a hall of stone. Head first ('hold-mountain'), plural -ok."
from = "dwarvish"
joins = "dwarvish"
stress = "last"
# No native i, no diphthongs; adds v and kv; no w, y, f. These weights are a first tuning.
vowels = { u = 30, o = 30, a = 25, e = 15 }
consonants = { r = 10, b = 8, d = 8, g = 8, k = 6, n = 6, v = 5, m = 5, s = 5, t = 5, kv = 4, p = 2, h = 2 }
onsets = ["br", "dr", "gr", "kr", "pr", "tr"]
initial_onsets = ["sk", "st"] # only in loans (skir)
codas = ["p", "t", "k", "b", "d", "g", "m", "n", "s", "r", "v", "rn", "rk", "rd", "nd", "nk", "mb", "st", "sk"]
final_codas = ["p", "t", "k", "b", "d", "g", "m", "n", "s", "r", "v", "rn", "rk", "rd", "nd", "nk", "mb", "st", "sk"]
final_vowel = true
# Sounds only loans have: a careful player can tell a loan from a native word, as with French
# words in English. `gen` never draws them and native roots may not use them.
loan_only = ["i", "ch"]
gen = { syllables = { 1 = 100 }, onset = 85, cluster = 22, coda = 95, final_cluster = 55 }

# Bynames and true names (Ronald, 11-06: "Yes, bynames + true names"). Outside their holds a dwarf
# goes by a plain English byname, which is what players mostly meet. The true name, in Dwarvish,
# is learned as the player's standing with the hold grows (reputation, notes/PROGRESSION.md).
# Every dwarvish person needs a `byname`; bynames follow the English rules (no grand mash-ups).
[people.dwarvish.naming]
shown = "byname"
true_name = "learned through standing with the hold"
byname_examples = ["Old Oath", "Ironhand"]

# Which tongue names a ruin follows who lives near it.
[regions]
forest = "elvish"
mountain = "dwarvish_loan"
cold = "dwarvish_loan"
coast = "worn"
plains = "worn"
swamp = "worn"
desert = "worn"

# ---------------------------------------------------------------------------------------------
# Old Eskenai's roots (section 8). Roots were checked against English, Russian, French and German
# for funny, rude or loaded meanings; dropped first picks are in [bad_words]. Add a root only when
# no root fits (style rule 6), from `gen`, with its meaning.
# ---------------------------------------------------------------------------------------------
[root]
esk = { means = "star" }
kep = { means = "fall, come down" }
nai = { means = "be born, begin" }
rai = { means = "light, shine" }
nau = { means = "night, dark" }
dau = { means = "fire, burn" }
skir = { means = "ice, cold" }
omu = { means = "water, sea" }
hes = { means = "sky, air" }
bor = { means = "mountain, height" }
nu = { means = "deep, below" }
duk = { means = "stone" }
tem = { means = "iron, metal" }
tauk = { means = "gate, a way through" }
aru = { means = "line, flow (ley)" }
kaun = { means = "keep, guard" }
gom = { means = "beast, creature" }
dren = { means = "tree, wood" }
has = { means = "dry, sand" }
pok = { means = "rot, mire" }
pem = { means = "world" }
maun = { means = "mind, knowing" }
sen = { means = "word, mark, rune" }
ta = { means = "make, build" }
ris = { means = "break, ruin" }
eka = { means = "old, first" }
gai = { means = "great" }
pai = { means = "seed, egg, young" }
rem = { means = "watch, see" }
wom = { means = "voice, call" }
ber = { means = "go, cross" }
taru = { means = "sleep, wait" }
kru = { means = "bone" }
ema = { means = "life, blood" }
tun = { means = "hollow, cave" }

# Endings, written with a leading hyphen in a build.
[ending]
ar = { means = "one who", example = "kaunar, keeper" }
an = { means = "place of", example = "dukan, stone place (a ruin)" }
ek = { means = "a made thing", example = "senek, an inscription" }
o = { means = "done", example = "kepo, fallen" }

# How Old roots join (section 7), checked by `check`:
#   1. the modifier comes first and the head last;
#   2. if three consonants would meet, or two of the same, put e between;
#   3. if two vowels meet, the first plain vowel drops; a diphthong's second half becomes w or y.
[[join_example]]
build = ["hes", "dau"]
form = "hesdau"
[[join_example]]
build = ["esk", "nai"]
form = "eskenai"
[[join_example]]
build = ["esk", "tem"]
form = "esketem"
[[join_example]]
build = ["aru", "ema"]
form = "arema"
[[join_example]]
build = ["dau", "aru"]
form = "dawaru"

# ---------------------------------------------------------------------------------------------
# The drifts (section 9), each applied in order, in SCA² syntax: target/replacement/environment,
# with an optional /exception. `_` is the sound changed, `#` a word's edge, a capital a category,
# `(X)` something that may be there. Commas pair targets with replacements; an empty target
# inserts, an empty replacement deletes. A hard case can be checked in Lexurgy or SCA² as written.
# ---------------------------------------------------------------------------------------------
[drift.soft]
title = "Soft"
used_for = "Elvish, and the forest ruins"
rules = [
  { sca = "sp,st,sk/s,s,s/#_", says = "s plus p, t or k at the start loses the stop: skir → sir" },
  { sca = "/a/C_#/n_#", says = "a word ending in a consonant other than n takes -a: duk → duka" },
  { sca = "p,t,k/b,d,g/V_V", says = "p t k become b d g between vowels: duka → duga" },
  { sca = "r/l/V_V", says = "r becomes l between vowels: aru → alu" },
  { sca = "ai/ei/_", says = "ai becomes ei: nai → nei" },
]

[drift.frost]
title = "Frost"
used_for = "the dwarves' loans, and mountain and cold ruins"
rules = [
  { sca = "P//V(C)(C)(C)_#", says = "in words of two or more syllables, a final single vowel drops: aru → ar" },
  { sca = "au,ai/o,e/_", says = "au becomes o, ai becomes e: kaun → kon, tauk → tok" },
  { sca = "k/ch/_F/s_", says = "k becomes ch (as in church) before i or e, but not after s: kepesk → chepesk" },
  { sca = "b,d,g/p,t,k/_#", says = "b d g become p t k at the end of a word" },
]

[drift.worn]
title = "Worn"
used_for = "humans and traders, coasts, plains, swamps, deserts; the latest era"
rules = [
  { sca = "h//#_", says = "h at the start of a word drops: has → as" },
  { sca = "P//#(C)(C)VC_CV", says = "in words of three or more syllables, a vowel in the second syllable between single consonants drops: ekaru → ekru" },
  { sca = "u/o/_", says = "u becomes o (but au stays): duk → dok, nu → no" },
  { sca = "n/ng/_G", says = "n becomes ng before k or g" },
  { sca = "sk/sh/_#", says = "a final sk becomes sh: kepesk → kepesh" },
]

# The same word in all four forms (section 9's table), checked by `check`.
[[drift_example]]
build = ["esk", "nai"]
