# ---------------------------------------------------------------------------------------------
# The names. Each one:
#   kind     boss, ruin, relic, rune, spell, dimension, people, realm, place, weapon, material,
#            person, title, word
#   people   which tongue gives the shown form (a [people] key)
#   build    roots and -endings, joined by that people's rules (" " is a word break)
#   form     what the game shows; `check` re-derives it from the build
#   gloss    the meaning, for translators and the journal
#   what     what it is in the game
#   epithet  a boss's English title (translated): "Borkon, the Height-Keeper"
#   english  the English shown beside it (translated): "Maunsen (Mind-Rune)"
#   byname   a dwarf's English byname, what players meet first
#   home     an elvish home, whose dialect derives it
#   irregular = "why"   a deliberate exception to the derivation
#   lang_key the game's key, once it is in the lang files (`check` then wants it in en, ru, fr;
#            the epithet under <key>.title). None yet: names go in after Ronald picks them.
# ---------------------------------------------------------------------------------------------

