# ---------------------------------------------------------------------------------------------
# Against the generic (section 4 and the style guide, section 14). Each pattern is a regular
# expression on the lower-case form. `people` and `kinds` narrow where it applies; `on` is "form"
# (default) or "english" (bynames, epithets and other English names).
# ---------------------------------------------------------------------------------------------
[[banned]]
re = "[xzqj]"
why = "x, z, q and j used to look exotic (Xyrthos, Zyrael)"
[[banned]]
re = "th"
why = "th: stock fantasy, and Tolkien's"
[[banned]]
re = "ae"
why = "ae: stock fantasy (Aeth-, Ael-)"
[[banned]]
re = "y(?![aeiou])"
why = "y as a vowel"
[[banned]]
re = "([a-z])\\1"
why = "doubled letters"
[[banned]]
re = "['\\-\\u00c0-\\u024f]"
why = "apostrophes, hyphens and accents (an epithet is set off with a comma)"
[[banned]]
re = "(ia|ion|oth|wyn|ryn)$"
why = "stock endings -ia, -ion, -oth, -wyn, -ryn"
[[banned]]
re = "^(aeth|ael|vael)"
why = "stock openings Aeth-, Ael-, Vael-"
[[banned]]
re = "^(elara|lyra|kael|kaelen|thorne|eldoria|voss|silas)$"
why = "the names language models keep producing"
[[banned]]
re = "(iel|wen|dor|ion|las|ndil)$"
people = ["elvish"]
why = "reads as Tolkien or generic elf: -iel, -wen, -dor, -ion, -las, -ndil"
[[banned]]
re = "^(gal|cel|mith)"
people = ["elvish"]
why = "reads as Tolkien: gal-, cel-, mith-"
[[banned]]
re = "^el"
people = ["elvish"]
kinds = ["person"]
why = "El- at the start of an elf's personal name"
[[banned]]
re = "^kh|(dum|dûm|zul)$"
people = ["dwarvish", "dwarvish_loan"]
why = "Tolkien's Khuzdul: Kh-, Khaz-, -dûm, -zul"
[[banned]]
re = "^(durin|thorin|balin|dvalin|dwalin|dain|nain|thrain|thror|oin|gloin|ori|nori|dori|fili|kili|bifur|bofur|bombur|fundin)$"
people = ["dwarvish", "dwarvish_loan"]
why = "the Norse dwarf list (and Tolkien's)"
[[banned]]
re = "^(storm|shadow|blood|ember)|(forge|fall|heim|gard)$"
on = "english"
why = "grand English mash-ups: an English name must be concrete and local (Bywater, not Stormwatch)"
[[banned]]
re = "\\b(the )?(eternal|unbroken)\\b"
on = "english"
why = "grand titles"

# Words that make a name funny, rude or loaded in a language players read, written in our
# letters (Russian by the Cyrillic table below). Three letters or fewer match a whole word; longer
# ones match anywhere in it. The check is for real collisions, not for every short word.
[bad_words]
# Dropped first picks for roots (section 8): sau and gau (German "sow", and the Nazi-era Gau),
# ham, nosk (Russian носки "socks"), wai (Maori "water").
en = ["ham", "ass", "arse", "anus", "butt", "poo", "poop", "puke", "turd", "fart", "shit", "piss", "fuck", "cunt", "cock", "dick", "twat", "wank", "slut", "whore", "crap", "bum", "boob", "knob", "rape", "nazi", "isis", "kkk", "fag", "gook", "kike", "coon", "paki", "spic", "nig", "dung", "snot", "pee", "wee", "tit"]
ru = ["nosk", "hui", "huy", "her", "suka", "suchka", "govno", "gavno", "srat", "sran", "derm", "mudak", "durak", "kaka", "pisa", "siska", "trah", "hren", "bla", "blad", "ebat", "eban", "yob", "manda", "pidor", "pider", "perd", "loh", "debil", "padla", "kozel", "sopl", "zad", "pup"]
fr = ["merde", "putain", "pute", "con", "conne", "cul", "bite", "chier", "pet", "salaud", "salope", "nique", "foutre", "couille", "bordel", "enkule", "caca", "pipi", "crotte", "pisse", "zob"]
de = ["sau", "gau", "scheis", "sheis", "arsch", "kacke", "fotze", "pisse", "mist", "furz", "titte", "dreck", "fick", "hure", "depp", "doof", "heil", "nazi"]
mi = ["wai"]

# Russian writes invented names by one fixed table (section 14); French and English keep them as
# written. Longer keys are read first. `e_initial` is e at a word's start. The table's first rows
# are the report's; the plain letters after them are the obvious ones.
[cyrillic]
ai = "ай"
au = "ау"
ei = "эй"
ch = "ч"
sh = "ш"
ng = "нг"
kv = "кв"
sk = "ск"
a = "а"
e = "е"
e_initial = "э"
i = "и"
o = "о"
u = "у"
k = "к"
g = "г"
h = "х"
w = "в"
y = "й"
p = "п"
t = "т"
b = "б"
d = "д"
m = "м"
n = "н"
s = "с"
r = "р"
f = "ф"
l = "л"
v = "в"

# Where `check` looks for lang keys, and which languages every key needs.
[lang]
dirs = ["crates/engine/assets/lang", "mods/base/assets/lang", "mods/animals/assets/lang", "mods/portals/assets/lang", "mods/packages/assets/lang"]
files = ["en_us", "ru_ru", "fr_fr"]

# `gen`: a candidate is too close to a word already in the lexicon when one edit turns one into
# the other (for words of four letters or more), or when it has the same consonants with other
# vowels (for any length): the existing short roots (nu, nau; has, hes) stay as they are. A root
# has at least `min_sounds` sounds and one consonant.
[gen]
min_distance = 2
min_sounds = 2

# Everyday words in a language players read: `gen` never offers them, since an invented root that
# is a plain word reads as that word (get, mud, run). Roots already chosen may be one (bor is
