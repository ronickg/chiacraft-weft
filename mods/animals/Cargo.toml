[package]
name = "animals"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Animals: dogs, cats, capybaras and raptors to tame, ride and breed, with coats from real genes"

[lib]
crate-type = ["cdylib"]

[dependencies]
weft_sdk.workspace = true
# Coats from genes (`src/coats.rs`): gene files and coat layers read at startup.
png.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
