[package]
name = "animals_web"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "The animals mod's logic for the website: animals_core behind a small JSON API, compiled to WASM"

[lib]
crate-type = ["cdylib"]

[dependencies]
animals_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
