# CI's test runs (`cargo nextest run --profile ci`): a test still running after a minute is
# reported as slow, and stopped after five.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

# The sandbox's first test builds its test mod for wasm32 first, from nothing on a cold cache.
[[profile.ci.overrides]]
filter = "package(chiacraft-sandbox)"
slow-timeout = { period = "60s", terminate-after = 15 }
