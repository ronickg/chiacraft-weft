# Builds the workspace, lints it and runs every check that has no person in it, on every push to
# dev and main and every pull request: the unit tests, the mods' checks (including the sheets that fail
# when SHEET.md, SPECIES.md, PROGRESSION_SHEET.md or NAMES.md is stale), the animals' rules through WASM, and the testkit against
# the real game. Linux has no GPU here: the game draws with Mesa's software Vulkan (lavapipe)
# into a virtual X screen.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# A newer push waits for the run before it rather than stopping it, so every run gets to the end
# and leaves its cache for the next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The build, clippy's and the tests' builds of the whole workspace filled the runner's disk.
    # Debug info is most of it, and nothing here reads it.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The runner's own tools that nothing here uses (.NET, Android, Haskell, CodeQL): about 30 GB.
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      # wasm32: the sandbox's tests build a mod for it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build
        run: cargo build --workspace

      # mut_from_ref fires in Weft's own crates/sdk/src/game.rs, which stays as upstream has it.
      - name: Clippy
        run: cargo clippy --workspace -- -A clippy::mut_from_ref

      # nextest stops a test that hangs (.config/nextest.toml) and names it.
      - name: Tests (chiacraft crates)
        run: cargo nextest run --profile ci -p chiacraft-account -p chiacraft-packages --lib

      # Every tests/*.rs, the chain ones on chia-sdk-test's simulator (`sim`): throwaway keys, no
      # network. chain_live.rs only runs with HORIZON_CHAIN_LIVE=1, which CI never sets.
      - name: Tests (wallet)
        run: cargo nextest run --profile ci -p chiacraft-wallet --features sim

      - name: Tests (sponsor)
        if: hashFiles('crates/sponsor/Cargo.toml') != ''
        run: cargo nextest run --profile ci -p chiacraft-sponsor --features service

      # tests/sandbox.rs runs a real mod (tests/guest) and is only built with `pack`.
      - name: Tests (sandbox)
        run: cargo nextest run --profile ci -p chiacraft-sandbox --features pack

      - name: Tests (store)
        if: hashFiles('crates/store/Cargo.toml') != ''
        run: cargo nextest run --profile ci -p chiacraft-store

      - name: Tests (engine)
        run: cargo nextest run --profile ci -p weft_engine

      # nextest doesn't run doc tests.
      - name: Doc tests (engine)
        timeout-minutes: 15
        run: cargo test --doc -p weft_engine

      # Unit tests, tests/places.rs, and tests/sheet.rs: SHEET.md, SPECIES.md and
      # PROGRESSION_SHEET.md are what the code says; progression's checks (everything tagged with
      # an age and path, reachable, in tier order, inside its fight bands).
      - name: Tests (survival numbers, animals, progression)
        run: cargo nextest run --profile ci -p vitals -p animals_core -p progression

      - name: Tests (base, its API, packages mod)
        run: cargo nextest run --profile ci -p base -p base_api -p packages

  # Is the code getting bloated (reports/code-health/README.md): the report goes into the run's
  # summary and an artifact. It fails nothing yet. Runs wherever CI runs: dev lives on the Mac, so
  # pull requests are where it is seen.
  code-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the growth table needs the fork point and upstream's history
      - name: Upstream refs
        run: git fetch --no-tags https://github.com/VortexSo4/Weft master:refs/remotes/upstream/master || true
      - name: Report
        run: |
          python3 -I reports/code-health/health.py --json health.json > health.md
          cat health.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: code-health
          path: |
            health.md
            health.json

  # The invented words (mods/base/lore/lexicon.toml): every name re-derives from its roots, keeps
  # its people's sound rules, matches no banned pattern or bad word, and notes/NAMES.md is what the
  # lexicon says (`python3 tools/names/names.py sheet > notes/NAMES.md`).
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Names
        run: python3 -I tools/names/names.py check
      # The check itself: it must catch every fault in tools/names/faults.toml.
      - name: Names (the check's fault set)
        run: python3 -I tools/names/names.py selftest

  animals-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The game's own rules compiled to WASM: inheritance, timings, caps, evolution, balance.
      - name: Animals' rules
        run: mods/animals/web/build.sh && node mods/animals/web/test.mjs

  # The game and its mods once, as `cargo run --release -- --test ...` runs them; the testkit jobs
  # share it.
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build
        run: cargo build --release

      # A tar keeps the permission to run the game, which the artifact alone would lose. The mods'
      # libraries sit beside the game, where it looks for them.
      - name: Pack
        run: tar -cf game.tar target/release/weft target/release/*.so

      - uses: actions/upload-artifact@v7
        with:
          name: game
          path: game.tar
          retention-days: 3

  # About 210 tests take over two hours one after the other on software Vulkan, so each job runs
  # every Nth (`--test-shard i/N`), and the ones that measure the game's speed run on their own.
  testkit:
    needs: game
    strategy:
      fail-fast: false
      matrix:
        shard: [0/6, 1/6, 2/6, 3/6, 4/6, 5/6, alone]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 xvfb mesa-vulkan-drivers vulkan-tools \
            libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1

      - uses: actions/download-artifact@v8
        with:
          name: game

      - name: Unpack
        run: tar -xf game.tar

      - name: Software Vulkan
        run: xvfb-run -a vulkaninfo --summary

      # Every wait in a test has its own timeout; this is for a game that stops answering. The
      # packages tests need the examples' packages; the other tests don't mind them. TESTKIT_CI
      # leaves out what mods/testkit/ci-skip.txt names (timing a few frames a second can't meet),
      # each a SKIP line in the log and the report.
      - name: Testkit ${{ matrix.shard }}
        timeout-minutes: 45
        env:
          TESTKIT_CI: "1"
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24"
          target/release/weft --packages examples/packages --test all --test-shard ${{ matrix.shard }}

      - name: Report name
        if: always()
        run: echo "REPORT=testkit-$(echo '${{ matrix.shard }}' | tr / -)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.REPORT }}
          path: |
            run/test-reports/report.txt
            run/test-shots
            run/logs
          if-no-files-found: ignore
