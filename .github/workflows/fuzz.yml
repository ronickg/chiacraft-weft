# Fuzzes what reads data packages from strangers (crates/packages/fuzz): the manifest, the
# signature and the definitions, five minutes each, every week. A crash leaves its input as the
# `fuzz-<target>` artifact; replay it with `cargo +nightly fuzz run <target> <file>` in
# crates/packages.
name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  # And when what it fuzzes changes.
  pull_request:
    paths: ["crates/packages/**", ".github/workflows/fuzz.yml"]

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [manifest, signature, defs]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/packages
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/packages/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # The prebuilt cargo-fuzz is a musl binary and would build for musl, where the sanitizer
      # cannot run.
      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: crates/packages/fuzz/artifacts
