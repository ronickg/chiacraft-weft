[package]
name = "chiacraft-packages"
version = "0.1.0"
edition.workspace = true
license = "MIT"
rust-version.workspace = true
description = "Data-only content packages (chiacraft plan, phase 2): reads and checks a package's manifest and definitions"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
blake3 = "1.8"
# Reads a sandboxed component's imports (its API version) without running it (`code`).
wasmparser = { version = "0.239", default-features = false, features = ["std", "component-model"] }
