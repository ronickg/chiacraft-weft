[package]
name = "weft_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
weft_abi.workspace = true
chiacraft-packages = { path = "../packages" }
# Test only: loads a Minecraft world block for block (`chiacraft::mc_import`).
chiacraft-mcimport = { path = "../mcimport" }
weft_noise.workspace = true
weft_render.workspace = true
winit.workspace = true
glam.workspace = true
parry3d-f64 = { version = "0.31.1", default-features = false, features = ["required-features", "std", "alloc"] }
bytemuck.workspace = true
log.workspace = true
rayon.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
libloading.workspace = true
lz4_flex.workspace = true
png.workspace = true
rustc-hash.workspace = true
iroh.workspace = true
tokio.workspace = true
zip.workspace = true
kira.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
sha2.workspace = true
mimalloc.workspace = true
# The player's account (MIT, ours): the network key follows the account's 24 words.
chiacraft-account = { path = "../account" }
# The chain (phase 4): reading DIDs (the player's, the world's, a joining player's) through Chia
# full nodes. Started only when something asks (`chiacraft::chain`), never in the game loop.
chiacraft-wallet = { path = "../wallet", features = ["chain"] }
# Asking a DID sponsor over iroh (its client only).
chiacraft-sponsor = { path = "../sponsor" }
iroh-mainline-address-lookup = "0.6.1"

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
naga.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# NativeActivity: no Java of our own to build.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true
