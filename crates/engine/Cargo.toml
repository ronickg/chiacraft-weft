[package]
name = "weft_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
weft_abi.workspace = true
chiacraft-packages = { path = "../packages" }
weft_noise.workspace = true
weft_render.workspace = true
winit.workspace = true
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
rayon.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
libloading.workspace = true
lz4_flex.workspace = true
png.workspace = true
rustc-hash.workspace = true
iroh.workspace = true
tokio.workspace = true
zip.workspace = true
kira.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
mimalloc.workspace = true
# The player's account (MIT, ours): the network key follows the account's 24 words.
chiacraft-account = { path = "../account" }
# The chain (phase 4): reading DIDs (the player's, the world's, a joining player's) through Chia
# full nodes. Started only when something asks (`chiacraft::chain`), never in the game loop.
chiacraft-wallet = { path = "../wallet", features = ["chain"] }
# Asking a DID sponsor over iroh (its client only).
chiacraft-sponsor = { path = "../sponsor" }
iroh-mainline-address-lookup = "0.6.1"

[dev-dependencies]
naga.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The system clipboard; Android has none arboard reaches (clipboard.rs keeps the game's own).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true

# Android: winit's NativeActivity glue (the app's entry is `android_main`, crates/android).
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
# The game is a library the activity dlopens, and Android refuses one with initial-exec TLS
# (mimalloc's default): the dynamic model there.
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }
