# chiacraft-sponsor's settings (every line is optional; these are the defaults unless noted).
# The funding wallet's words are never in this file: CHIACRAFT_SPONSOR_WORDS or
# CHIACRAFT_SPONSOR_WORDS_FILE. The sponsor's address (its iroh endpoint id) comes from the key it
# keeps in data_dir/sponsor.key: `chiacraft-sponsor --address` prints it.

network = "testnet11"           # or "mainnet", which also needs allow_mainnet = true (real XCH)
allow_mainnet = false            # the second setting mainnet needs; refuses to start without it
data_dir = "sponsor-data"        # sponsor-log.jsonl (what it did), chain-cache.json, sponsor.key
# words_file = "/run/secrets/sponsor-words"   # instead of the environment variables
addresses = 20                   # the funding wallet's addresses followed
peers = []                       # own full nodes ("host:port"); empty: the DNS introducers

# The next four (and max_batch) default by network; on mainnet, when left out: fee_per_did = 1000000,
# daily_budget_mojos = 50000000 (0.00005 XCH), per_endpoint_per_day = 1, max_batch = 5,
# max_fee_per_did = 100000000 (0.0001 XCH). A fee_per_did above max_fee_per_did refuses to start.
fee_per_did = 5000000            # mojos per DID (0.000005 TXCH); a batch of n pays n times this
daily_budget_mojos = 1000000000  # 0.001 TXCH a day: about 199 DIDs at the fee above
per_endpoint_per_day = 3         # DIDs per asking iroh endpoint a day (Horizon's per_ip_per_day)
# max_fee_per_did = 100000000    # testnet11: no cap unless set
max_skew_seconds = 300           # a request's time vs the sponsor's clock
work_bits = 22                   # proof of work per request: about 2^22 hashes (a second or two)
hourly_release = true            # the day's budget opens 1/24 per UTC hour: no draining it at midnight

batch_window_ms = 2000           # requests within 2 s of the first go in one bundle
max_batch = 25
max_queue = 200
max_wait_seconds = 120           # waiting for a free coin before a 503
drop_after_seconds = 3600        # an unconfirmed launch is dropped (identity freed, budget refunded)
