[package]
name = "chiacraft-mod-sdk"
version = "1.3.0"
edition.workspace = true
license = "MIT"
rust-version.workspace = true
description = "Write sandboxed chiacraft mods in Rust: Weft's SDK names over the chiacraft:mods@1.3.0 WIT world, built for wasm32-unknown-unknown (docs/sandboxed-mods.md)"

[dependencies]
# What both SDKs share: values, line arguments, item stacks, logging.
chiacraft-mod-common = { path = "../mod-common" }
# Weft's permission levels, stages and component flags, re-exported: one name each.
weft_abi = { path = "../abi" }
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc"] }
